android.useAndroidX=true
android.enableJetifier=true
android.enableR8=true
org.gradle.jvmargs=-Xmx4608m
dev.steenbakker.mobile_scanner.useUnbundled=true
# Kotlin's incremental compiler cache can't compute a relative path when the
# project (D:) and a pub-cache dependency (C:) are on different Windows
# drives - it throws "this and base files have different roots" and fails
# the whole compile. Incremental compilation is a local build-speed
# optimization only; disabling it just makes every Kotlin compile a clean
# one, with no effect on the produced app.
kotlin.incremental=false