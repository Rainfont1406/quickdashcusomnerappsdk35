plugins {
    id "com.android.application"
    id "kotlin-android"
    id 'com.google.gms.google-services'
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Google Maps + signing credentials live in local.properties (gitignored),
// not hardcoded here — they used to be literals in this file and in
// AndroidManifest.xml, which meant they sat in git history.
def googleMapsApiKey = localProperties.getProperty('GOOGLE_MAPS_API_KEY', '')
def releaseStoreFile = localProperties.getProperty('RELEASE_STORE_FILE')
def releaseStorePassword = localProperties.getProperty('RELEASE_STORE_PASSWORD')
def releaseKeyAlias = localProperties.getProperty('RELEASE_KEY_ALIAS')
def releaseKeyPassword = localProperties.getProperty('RELEASE_KEY_PASSWORD')

android {
    namespace 'com.emart.customer'
    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    signingConfigs {
        release {
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
            storeFile releaseStoreFile != null ? file(releaseStoreFile) : null
            storePassword releaseStorePassword
        }
    }

    defaultConfig {
        applicationId "com.quickdash.hadeveloper"
        minSdkVersion 26
        multiDexEnabled = true
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        manifestPlaceholders = [googleMapsApiKey: googleMapsApiKey]
    }

    flavorDimensions "env"
    productFlavors {
        production {
            dimension "env"
            // Uses the existing android/app/google-services.json (quick-dash-84f6a) as-is.
        }
        staging {
            dimension "env"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            // App name override lives in android/app/src/staging/res/values/strings.xml
            // (a resValue here collides with the existing app_name string resource).
            // Drop the quickdash-staging google-services.json at android/app/src/staging/google-services.json
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true // Enable code shrinking
            shrinkResources true // Enable resource shrinking
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // razorpay_flutter pulls in com.razorpay:checkout, which bundles the
    // card.io "scan your card with the camera" SDK (+ its OpenCV
    // dependency) as prebuilt .so files compiled with an old, buggy NDK
    // version — Play Console flags these specifically as a 16 KB-device
    // crash risk (Test and release > "Your app could crash on 16 KB
    // devices"). Razorpay hasn't published a fixed checkout build in 2+
    // years (latest on Maven Central is still 1.6.41), so there's no
    // version bump that fixes this. The app never enables card-scanning
    // (Razorpay's checkout UI just shows the camera icon automatically
    // when these libs are present) — manual card entry and all payments
    // are unaffected by removing them.
    packagingOptions {
        exclude 'lib/*/libcardioDecider.so'
        exclude 'lib/*/libcardioRecognizer.so'
        exclude 'lib/*/libcardioRecognizer_tegra2.so'
        exclude 'lib/*/libopencv_core.so'
        exclude 'lib/*/libopencv_imgproc.so'
    }
}
configurations.all {
    exclude group: "com.google.mlkit", module: "barcode-scanning"
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:30.5.0')
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'io.card:android-sdk:5.+'
    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:16.1.4'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
